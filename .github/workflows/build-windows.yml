name: Build GitAddonsManager branch fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'apply_branch_fix.py'
      - '.github/workflows/build-windows.yml'

jobs:
  build-win64:
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed
    env:
      CI_COMMIT_BRANCH: branchfix
      CI_DEFAULT_BRANCH: branchfix
      CI_JOB_NAME: Win64
    steps:
      - name: Install bootstrap tools
        run: zypper -q install -y git find wine-staging wine-staging-32bit wget make p7zip tar gzip patch python3 || true

      - name: Check out build harness
        uses: actions/checkout@v4

      - name: Clone exact WobLight base
        run: |
          git clone https://gitlab.com/woblight/GitAddonsManager.git src
          cd src
          git checkout 4cfafffd4e48038203622f201729349b8e8b9809

      - name: Apply and verify branch fix
        run: |
          python3 "$GITHUB_WORKSPACE/apply_branch_fix.py" src/addon.cpp
          cd src
          git diff --check
          git diff -- addon.cpp
          git diff -- addon.cpp > "$GITHUB_WORKSPACE/GitAddonsManager_branch_fix.generated.patch"

      - name: Fix current CMake/Wine install-prefix compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/CI.mk")
          s = p.read_text(encoding="utf-8")
          old = '--install-prefix="/libgit2-0.27.2/release"'
          new = '-DCMAKE_INSTALL_PREFIX="Z:$(pwd)/libgit2-0.27.2/release"'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f"Expected one libgit2 install-prefix occurrence, found {count}")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          print("Patched CI.mk libgit2 install prefix for current CMake under Wine.")
          PY

      - name: Build portable Win64 package
        working-directory: src
        run: |
          make -f CI.mk windeploy
          make -f CI.mk finalize

      - name: Include generated patch in package
        run: cp "$GITHUB_WORKSPACE/GitAddonsManager_branch_fix.generated.patch" src/GitAddonsManager/

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: GitAddonsManager-Win64-branchfix
          path: src/GitAddonsManager/
          if-no-files-found: error
