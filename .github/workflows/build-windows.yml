name: Build GitAddonsManager

on:
  workflow_dispatch:
  push:
    paths:
      - 'apply_branch_fix.py'
      - 'gam-enhancements.patch'
      - '.github/workflows/build-windows.yml'

jobs:
  build-win64:
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed
    env:
      CI_COMMIT_BRANCH: main
      CI_DEFAULT_BRANCH: main
      CI_JOB_NAME: Win64
      GAM_RELEASE_VERSION: v1.2.0
    steps:
      - name: Install bootstrap tools
        run: zypper -q install -y git find wine-staging wine-staging-32bit wget make p7zip tar gzip patch python3 || true

      - name: Check out build harness
        uses: actions/checkout@v4

      - name: Clone exact WobLight base
        run: |
          git clone https://gitlab.com/woblight/GitAddonsManager.git src
          cd src
          git checkout 4cfafffd4e48038203622f201729349b8e8b9809

      - name: Apply and verify branch fix
        run: |
          python3 "$GITHUB_WORKSPACE/apply_branch_fix.py" src/addon.cpp
          cd src
          git diff --check
          git diff -- addon.cpp
          git diff -- addon.cpp > "$GITHUB_WORKSPACE/GitAddonsManager_branch_fix.generated.patch"

      - name: Apply GAM enhancements
        run: |
          cd src
          git apply "$GITHUB_WORKSPACE/gam-enhancements.patch"
          git diff --check

      - name: Fix current CMake/Wine install-prefix compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/CI.mk")
          s = p.read_text(encoding="utf-8")

          old_release_opt = '-DGitAddonsManager_BRANCH_NAME=$(branch)'
          new_release_opt = old_release_opt + ' -DGitAddonsManager_RELEASE_VERSION="$(GAM_RELEASE_VERSION)"'
          fcount = s.count(old_release_opt)
          print(f"Found {fcount} app CMake option blocks needing release version")
          if fcount != 1:
              raise SystemExit(f"Expected one app CMake option block, found {fcount}")
          s = s.replace(old_release_opt, new_release_opt, 1)

          old = '--install-prefix="$(winepwd)/'
          new = '--install-prefix="Z:$(pwd)/'
          count = s.count(old)
          print(f"Found {count} Windows install-prefix entries using winepwd")
          if count != 4:
              raise SystemExit(f"Expected four Windows install-prefix entries, found {count}")

          s = s.replace(old, new)

          old_quazip = "QuaZip-Qt6-1.5"
          new_quazip = "QuaZip-Qt6-1.7.2"
          qcount = s.count(old_quazip)
          print(f"Found {qcount} stale QuaZip 1.5 package-path entries")
          if qcount != 1:
              raise SystemExit(f"Expected one QuaZip 1.5 package-path entry, found {qcount}")
          s = s.replace(old_quazip, new_quazip)

          p.write_text(s, encoding="utf-8")
          print("Patched all Windows dependency install prefixes to Wine Z: absolute paths.")
          print("Patched final QuaZip package path from 1.5 to 1.7.2.")
          PY

      - name: Build portable Win64 package
        working-directory: src
        run: |
          make -f CI.mk windeploy
          make -f CI.mk finalize

      - name: Include patch references in package
        run: |
          cp "$GITHUB_WORKSPACE/GitAddonsManager_branch_fix.generated.patch" src/GitAddonsManager/
          cp "$GITHUB_WORKSPACE/gam-enhancements.patch" src/GitAddonsManager/

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: GitAddonsManager-Win64
          path: src/GitAddonsManager/
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload legacy updater bridge
        uses: actions/upload-artifact@v4
        with:
          name: GitAddonsManager-Win64-branchfix
          path: src/GitAddonsManager/
          if-no-files-found: error
          include-hidden-files: true
